<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create and take Solid questionnaires" />
    <title>Questionnaire</title>
    <style>
      /* Keep the first-paint loader visible before JavaScript-injected styles load. */
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #17213a; background: #f4f5f8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      #PageHeader { min-height: 48px; background: #172136; }
      #app.app-loading { display: grid; max-width: none; min-height: calc(100vh - 48px); place-items: center; padding: 24px; }
      .page-loading { display: grid; justify-items: center; gap: 14px; color: #566079; text-align: center; }
      .page-loading p { margin: 0; font-size: 14px; font-weight: 600; }
      .page-loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e7e3ff;
        border-top-color: #6c5ce7;
        border-right-color: #9d91f0;
        border-radius: 50%;
        box-shadow: 0 8px 24px rgb(108 92 231 / 14%);
        animation: page-loading-spin .85s linear infinite;
      }
      @keyframes page-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .page-loading-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <header id="PageHeader" aria-label="Solid account">
      <div class="page-header-placeholder" aria-hidden="true"></div>
    </header>
    <main id="app" class="app-loading">
      <div class="page-loading" role="status" aria-live="polite">
        <span class="page-loading-spinner" aria-hidden="true"></span>
        <p>Getting your learning space ready…</p>
      </div>
    </main>
    <script type="module" src="/src/standalone/main.ts"></script>
  </body>
</html>
